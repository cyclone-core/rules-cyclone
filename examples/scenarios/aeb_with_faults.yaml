# 故障注入用例：同 seed、同数据，仅注入故障——近距/远距断言应变红
# 演示点：唯一变量是故障规则，verdict 变化完全归因于注入
name: aeb_with_faults
seed: 42
duration_ms: 15000
dataset: objects://data/aeb_approach.csv
sut: inline:toy_perception

faults:
  # 近距离段丢帧 800ms（模拟传感器卡死）：近距召回率跌破阈值
  - { name: near_dropout, at_ms: 10000, duration_ms: 800, action: { type: drop } }
  # 远距离目标距离系统性偏移 +5m（模拟标定漂移）：超出匹配容差，远距召回率崩塌
  - { name: far_bias, at_ms: 0, duration_ms: 15000,
      action: { type: corrupt_field, field: dist, offset: 5.0 },
      min_dist: 80, max_dist: 999999 }

metrics:
  - { name: 近距召回率, metric: recall, bin: [0, 50], op: gte, value: 0.98 }
  - { name: 中距召回率, metric: recall, bin: [50, 80], op: gte, value: 0.70 }
  - { name: 远距召回率, metric: recall, bin: [80, 999999], op: gte, value: 0.20 }
  - { name: 帧均误检, metric: fp_per_frame, op: lte, value: 0.05 }
